name: Lint

on: [push, pull_request]

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting tools
        run: pip install black ruff
      - name: Black check
        run: black --check .
      - name: Ruff check
        run: ruff check .
